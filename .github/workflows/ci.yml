name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    # Every uv command in this job must use uv.lock as committed. A stale lock fails
    # `uv sync`, and `uv run` cannot re-lock. The VM installs from this same lock, so
    # it gets the versions this job tested. Plain `uv run` would re-lock silently.
    env:
      UV_LOCKED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
