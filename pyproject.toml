[project]
name = "kwb"
version = "0.1.0"
description = "Calibrated probabilistic forecaster and decision layer for Kalshi daily-high temperature markets."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-cloud-storage>=3",
    "google-crc32c>=1.9.0",
    "zstandard>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kwb"]

[dependency-groups]
dev = ["pytest", "ruff"]
notebooks = [
    "grib2io>=2.8.2",
    "ipykernel>=7.4.0",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pandas>=3.1.1",
    "pyproj>=3.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.uv.config-settings-package]
# The archive notebook selects a containing cell; it does not interpolate.
grib2io = { "cmake.define.GRIB2IO_WITH_IP" = "OFF" }

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "DTZ"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
