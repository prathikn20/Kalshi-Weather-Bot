[project]
name = "kwb"
version = "0.1.0"
description = "Calibrated probabilistic forecaster and decision layer for Kalshi daily-high temperature markets."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb==2.0.0",
    "google-cloud-storage>=3",
    "google-crc32c>=1.9.0",
    "pyarrow==26.0.1",
    "pydantic==2.14.3",
    "zstandard>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kwb"]

[dependency-groups]
dev = [
    "hypothesis==6.170.15",
    "pytest",
    "ruff",
]
ndfd = [
    "grib2io==2.8.2",
    "pyproj==3.8.0",
    "shapely==2.1.2",
    "pyshp==2.3.1",
]
notebooks = [
    { include-group = "ndfd" },
    "ipykernel>=7.4.0",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pandas>=3.1.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.uv]
build-constraint-dependencies = ["scikit-build-core==1.1.2", "cython==3.3.1", "numpy==2.5.4", "cmake==3.31.6"]

[tool.uv.config-settings-package]
# The archive notebook selects a containing cell; it does not interpolate.
grib2io = { "cmake.define.GRIB2IO_WITH_IP" = "OFF" }

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "DTZ"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
